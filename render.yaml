# Render Blueprint. Secrets are set in the Render dashboard, never here.
services:
  - type: web
    name: gladewood-commons-ops-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAILS
        sync: false
  - type: cron
    name: gladewood-automations
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.cli run-automations && python -m app.cli send-due-campaigns && python -m app.cli retry-screening && python -m app.cli dispatch-outbox
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_POSTAL_ADDRESS
        sync: false
      - key: EMAIL_UNSUBSCRIBE_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RULE11_ROUTER_URL
        sync: false
      - key: RULE11_SECRET
        sync: false
      - key: PORTAL_ALERT_EMAIL
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: OUTBOX_SHADOW
        sync: false
      - key: OUTBOX_PAUSED
        sync: false
      - key: OUTBOX_ALLOWED_PRICES
        sync: false
  - type: cron
    name: gladewood-digest
    runtime: python
    schedule: "0 12 * * *"  # 7 am Eastern in winter, 8 am in summer
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.cli send-digest
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_POSTAL_ADDRESS
        sync: false
      - key: EMAIL_UNSUBSCRIBE_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
