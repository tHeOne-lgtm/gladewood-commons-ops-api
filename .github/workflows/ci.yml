name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gladewood_migrate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_BASE: postgresql://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes app tests alembic api_server.py
      - name: Security scan
        run: python -m bandit -q -ll -r app api_server.py
      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt
      - name: Migrations apply, roll back, and re-apply
        env:
          DATABASE_URL: ${{ env.PG_BASE }}/gladewood_migrate
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Unit tests (SQLite)
        run: python -m pytest -q
      - name: Unit tests (Postgres)
        run: |
          python -c "import psycopg; c=psycopg.connect('${PG_BASE}/postgres', autocommit=True); c.execute('CREATE DATABASE gladewood_pytest')"
          TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/gladewood_pytest python -m pytest -q
